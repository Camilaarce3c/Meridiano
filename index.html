<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meridiano – Viajes por Europa</title>
<style>
:root{--bg:#f6f2ea;--card:#fffdf9;--tx:#1b2233;--mu:#6e6a62;--ac:#14213d;--go:#a8854f;--bd:#e4dccb;--ok:#2f6b4f;--er:#9b2c2c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#181c26;--tx:#ece7db;--mu:#9d9a90;--ac:#d9c08f;--go:#d9c08f;--bd:#2a3040;--ok:#7bc79d;--er:#e08a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#181c26;--tx:#ece7db;--mu:#9d9a90;--ac:#d9c08f;--go:#d9c08f;--bd:#2a3040;--ok:#7bc79d;--er:#e08a8a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.logo{font-size:22px;color:var(--ac);cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button,.btn{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 14px;border-radius:2px;cursor:pointer;font:inherit;font-size:14px;letter-spacing:.02em}
nav button.on{border-color:var(--go);color:var(--go)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--card)}
.btn.s{border-color:var(--go);color:var(--go)}
.btn.d{color:var(--er)}
main{max-width:1000px;margin:0 auto;padding:22px 18px 64px}
.hero{background-size:cover;background-position:center;color:#f6f2ea;border-radius:4px;padding:96px 36px 84px;margin-bottom:0}
.hero h1{margin:8px 0 14px;font-size:clamp(32px,6vw,52px);line-height:1.1;font-weight:500}.hero p{margin:0 0 24px;opacity:.92;max-width:540px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.cv{height:190px;background-size:cover;background-position:center;position:relative}
.cb{padding:16px}.cb h3{margin:0 0 4px}.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border:1px solid var(--go);color:var(--go);text-transform:uppercase;letter-spacing:.08em}
.ok{color:var(--ok)}h2{margin:6px 0 14px;font-size:24px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:2px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ban{background:var(--ac);color:var(--card);padding:6px 16px;text-align:center;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mod{background:var(--card);border-radius:4px;padding:22px;max-width:380px;width:100%}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.bank{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid var(--bd);border-radius:2px;margin-bottom:6px;cursor:pointer}
.bank input{width:auto;margin:0}
img.ph{width:100%;height:150px;object-fit:cover;display:block}
.ey{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--go)}
.hero .ey{color:#d9c08f}
.btn.big{padding:12px 24px;font-size:15px}.hero .btn.p{background:#d9c08f;border-color:#d9c08f;color:#14213d}.hero .btn.o{border-color:#f6f2ea;color:#f6f2ea}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--card);border:1px solid var(--bd);border-top:0;margin-bottom:36px}
.stats div{padding:18px;text-align:center;border-right:1px solid var(--bd)}.stats b{display:block;font:600 24px Georgia,serif;color:var(--go)}.stats span{font-size:13px;color:var(--mu)}
.dc{cursor:pointer;transition:transform .2s,box-shadow .2s}.dc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.pr{position:absolute;top:12px;right:12px;background:var(--card);border-color:var(--card);color:var(--tx)}
.sec{margin:44px 0 16px;text-align:center}.sec h2{margin:4px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps .card{padding:22px;text-align:center}.steps .n{font:600 30px Georgia,serif;color:var(--go)}
.ban2{background-size:cover;background-position:center;border-radius:4px;padding:90px 28px 26px;color:#fff;margin:14px 0 18px}.ban2 h2{margin:0;font-size:34px;color:#fff}.ban2 p{margin:4px 0 0;opacity:.9}
footer{border-top:1px solid var(--bd);background:var(--card);padding:28px 20px;text-align:center;color:var(--mu);font-size:13px}footer b{font-family:Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--bd);background:var(--card);margin-bottom:18px}
.facts div{padding:14px 16px;border-right:1px solid var(--bd)}.facts span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}.facts b{font:600 16px Georgia,serif}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:10px 14px;font:inherit;cursor:pointer}.tabs button.on{color:var(--tx);border-color:var(--go)}
.chip{border:1px solid var(--bd);background:none;color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--ac);color:var(--card);border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--bd);padding:14px 18px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mu)}
.q{font-family:Georgia,serif;font-size:17px;font-style:italic;margin:0 0 10px}
html{-webkit-text-size-adjust:100%}button,.card{-webkit-tap-highlight-color:transparent}
@media (max-width:640px){
body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
header{padding:10px 14px;justify-content:space-between}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;flex-wrap:nowrap;justify-content:space-around}
nav button{flex:1;border:0;font-size:12px;padding:10px 2px;min-height:44px;background:none}
nav button.on{color:var(--go);border-bottom:2px solid var(--go)}
main{padding:14px 14px 40px}
.hero{padding:64px 20px 48px}.hero p{font-size:16px}
.hero .row .btn{flex:1}
.stats div{border-bottom:1px solid var(--bd)}
.grid{grid-template-columns:1fr}
.cv{height:200px}
.btn,.chip{min-height:44px}
input,select,textarea{font-size:16px}
#cur{max-width:140px}
.ban2{padding:70px 18px 20px}.ban2 h2{font-size:28px}
.facts{grid-template-columns:1fr 1fr}
.tabs{overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}
.mod{max-height:90vh;overflow:auto}
.sec{margin-top:34px}h2{font-size:22px}
footer{padding-bottom:30px}
}
.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 26px Georgia,serif;color:#14213d;padding:12px;text-align:center}
</style>
</head>

<div id="ban" class="ban" hidden>Sin conexión: mostrando tus guías guardadas</div>

<main id="app"></main>

var K='meridiano-v3';
var seed={dest:[
{id:1,name:'París',region:'Francia',emoji:'🗼',c:'#e9dfe8',desc:'París es una ciudad que se recorre a pie y sin prisa: grandes museos como el Louvre y Orsay, bulevares elegantes, jardines, barrios con carácter como Montmartre y Le Marais, y una cultura de café y de bistró que invita a sentarse un rato. Es un destino para repetir, porque cada visita permite descubrir un rincón distinto, tanto en primavera como en otoño.',tips:['Louvre a primera hora o en nocturna del viernes','Atardecer en Montmartre','Croissant en una boulangerie de barrio'],price:9},
{id:2,name:'Roma',region:'Italia',emoji:'🏛️',c:'#efe3d0',desc:'Roma es un museo al aire libre donde veinte siglos de historia conviven en la misma calle. Entre el Coliseo, el Foro, el Vaticano y las fuentes del centro, cada esquina tiene algo que ver, y entre visita y visita siempre hay una trattoria cerca donde comer bien y a buen precio. Conviene reservar entradas con anticipación y dejar tiempo para perderse por Trastevere al caer la tarde.',tips:['Coliseo y Foro con entrada combinada','Fontana di Trevi al amanecer','Cacio e pepe en Trastevere'],price:9},
{id:3,name:'Lisboa',region:'Portugal',emoji:'🚋',c:'#dde8ea',desc:'Lisboa se levanta sobre siete colinas, con tranvías amarillos, fachadas de azulejos y miradores sobre el río Tajo. Es una capital amable, segura y económica en comparación con otras de Europa, y el portugués resulta fácil de entender para los hispanohablantes. A menos de una hora en tren está Sintra, con el colorido Palacio da Pena, una excursión que casi nadie se pierde.',tips:['Tranvía 28 temprano','Palacio da Pena (Sintra): reserva entrada con hora','Pastel de nata en Belém y fado en Alfama'],price:0},
{id:4,name:'Praga',region:'Chequia',emoji:'🏰',c:'#e4e1ee',desc:'Praga conserva casi intacto su casco histórico medieval, con puentes, torres y plazas que parecen sacadas de un cuento. Es una ciudad compacta, ideal para recorrer a pie, y ofrece una de las mejores relaciones entre precio y calidad de Europa central: buena cerveza, comida abundante y alojamiento accesible. Al amanecer, sin multitudes, es especialmente bonita.',tips:['Puente de Carlos al amanecer','Castillo de Praga y Callejón de Oro','Cerveza en Žižkov'],price:0},
{id:5,name:'Santorini',region:'Grecia',emoji:'🌅',c:'#dbe6f0',desc:'Santorini es una isla volcánica del mar Egeo, famosa por sus casas blancas, sus cúpulas azules y sus atardeceres sobre la caldera. Es uno de los destinos más fotogénicos y más caros de Grecia, por lo que conviene reservar con tiempo, evitar el pleno verano y combinar los pueblos de Fira y Oia con playas de arena volcánica y bodegas con vistas.',tips:['Caminata de Fira a Oia','Atardecer en Oia, llega con tiempo','Playa Roja y Akrotiri'],price:9},
{id:6,name:'Viena',region:'Austria',emoji:'🎻',c:'#efe6d6',desc:'Viena combina la elegancia imperial de los Habsburgo con una vida cultural muy activa: palacios, la Ópera, salas de concierto y cafés históricos donde se puede pasar la tarde con un periódico y un trozo de tarta. Es una ciudad limpia, ordenada y fácil de recorrer en transporte público, y en diciembre se llena de mercados navideños que atraen visitantes de todo el continente.',tips:['Palacio de Schönbrunn','Café Sacher y su tarta','Ópera de pie por pocos euros'],price:0}
],media:[],orders:[]};
